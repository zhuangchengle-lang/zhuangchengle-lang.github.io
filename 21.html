<!DOCTYPE html>
<html>
<head>
    <title>Game Introduction</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Georgia, "Times New Roman", serif; 
            background-color: #121214;  
            color: #e8e6e1;             
        }
        
        nav {
            background-color: #1a1a1d;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #2c2c31;
            position: sticky; 
            top: 0;
        }
        
        nav a {
            color: #b9b4a8;
            text-decoration: none; 
            margin: 0 12px;
            font-size: 16px;
            letter-spacing: 1px;
            transition: color 0.4s, background-color 0.4s;
            padding: 8px 14px;
            border-radius: 8px;
        }
       
        nav a:hover {
            color: #121214;
            background-color: #c9a86a;
        }
        
        main {
            padding: 40px 20px;
        }
        
        #title {
            color: #ece7dc;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
    
        .subtitle {
            text-align: center;
            color: #8a8578;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .two {
            width: 75%;
            max-width: 900px;
            padding: 30px 32px;
            margin: 24px auto; 
            border: 1px solid #2c2c31;
            border-radius: 16px;
            background: #1a1a1d;
        }

        h1, h2 {
            color: #e2ddd1;
            margin-bottom: 12px;
        }

        p, li {
            font-size: 16px;
            line-height: 1.8; 
            color: #b9b4a8;
        }

        ul { 
            padding-left: 20px;
        }

        li { 
            margin: 10px 0; 
        }
       
        .media {
            width: 100%;
            height: 180px;
            border-radius: 14px;
            margin: 16px 0;
            background: linear-gradient(135deg, #26262b 0%, #17171a 100%);
            border: 1px solid #2c2c31;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b6558;
            letter-spacing: 2px;
        }

        video {
            width: 100%;
            height: 500px;
            margin: 16px 0;
            border-radius: 12px;
        }

        .gold { 
            color: #c9a86a; 
        }

    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="21.html">Intro</a>
        <a href="22.html">Survivor</a>
        <a href="23.html">Hunter</a>
        <a href="24.html">Ranked</a>
        <a href="25.html">Quick Match</a>
    </nav>

    <main>
        <h1 id="title">IDENTITY V</h1>
        <p class="subtitle">MIDNIGHT MANOR · A 1v4 ASYMMETRIC GAME</p>
        <div class="two">
        <h2>Welcome to Identity V</h2>
        <p>In the manor shrouded in mist, <span class="gold">1 hunter</span> faces <span class="gold">4 survivors</span>. Decoding, chasing, rescuing and escaping — it all begins here.
        </p>     
        <video src= '1.mp4' controls>
        </div>
    </main>
</body>
</html>
